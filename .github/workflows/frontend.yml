name: Frontend CI/CD

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install dependencies
        working-directory: frontend/app
        run: npm ci

      - name: Build
        working-directory: frontend/app
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role-henriquephil-invoice
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: frontend/app
        run: |
          aws s3 sync dist/ s3://frontend-henriquephil-invoice-${{ secrets.AWS_ACCOUNT_ID }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable"