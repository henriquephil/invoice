name: Backend CI/CD

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (leave empty to auto-detect)"
        required: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need previous commit to diff

      - name: Detect changed services
        id: detect
        run: |
          # If manually triggered with a specific service, use that
          if [ -n "${{ github.event.inputs.service }}" ]; then
            echo "services=[\"${{ github.event.inputs.service }}\"]" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          ALL_SERVICES='["account","auth","catalog","gateway","invoice"]'

          # Changes to shared code rebuild everything
          if echo "$CHANGED" | grep -qE "^backend/commons/|^backend/build\.gradle\.kts|^backend/settings\.gradle\.kts|^backend/Dockerfile"; then
            echo "Shared code changed — rebuilding all services"
            echo "services=$ALL_SERVICES" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Detect per-service changes
          SERVICES=()
          for service in account auth catalog gateway invoice; do
            if echo "$CHANGED" | grep -q "^backend/$service/"; then
              SERVICES+=("\"$service\"")
            fi
          done

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "No service changes detected"
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            JSON="[$(IFS=,; echo "${SERVICES[*]}")]"
            echo "Services to build: $JSON"
            echo "services=$JSON" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role-henriquephil-invoice
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: backend
        id: build
        run: |
          IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}

          docker build \
            --build-arg SERVICE=${{ matrix.service }} \
            -t $IMAGE_URI \
            .

          docker push $IMAGE_URI

          docker tag $IMAGE_URI ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster henriquephil-invoice \
            --service ${{ matrix.service }} \
            --force-new-deployment \
            --region us-east-1